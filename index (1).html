<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YujianzZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--fg:#f2f2f2;--muted:color-mix(in srgb,var(--fg) 62%,var(--bg));--line:color-mix(in srgb,var(--fg) 18%,var(--bg));--surface:color-mix(in srgb,var(--fg) 6%,var(--bg));
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bgPaint,var(--bg));background-attachment:fixed;color:var(--fg);font:400 18px/1.75 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:14px 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
.hAct{justify-self:end;display:flex;gap:8px;align-items:center}
.brand{font-weight:900;font-size:26px;text-decoration:none;justify-self:start}
nav{display:flex;gap:4px}
nav a{text-decoration:none;padding:8px 16px;font-size:18px;color:var(--muted);border-bottom:2px solid transparent}
nav a:hover{color:var(--fg)}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:500}
button,.btn{font:inherit;cursor:pointer;background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:10px 20px;border-radius:10px;text-decoration:none;display:inline-block;line-height:1.5}
button:hover,.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500}
main{max-width:1120px;margin:0 auto;padding:56px 24px 96px}
section[hidden]{display:none}
h1{font-size:clamp(56px,11vw,108px);line-height:1.1;margin:0 0 16px;font-weight:900}
h2{font-size:32px;margin:56px 0 16px;line-height:1.3}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:center}
.hero canvas{width:340px;height:464px;justify-self:end;cursor:pointer;touch-action:pan-y}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.stats{display:flex;gap:48px;flex-wrap:wrap;margin-top:28px}
.stats b{display:block;font-size:48px;line-height:1.2;font-weight:900}
.stats span{color:var(--muted);font-size:16px}
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 22px;text-decoration:none;display:block}
a.card:hover{border-color:var(--fg)}
.card b{display:block;font-size:21px}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:8px;margin-bottom:14px;background:var(--line)}
#videoList{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
#featured .card{max-width:680px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:20px;color:var(--muted)}
.pills{display:flex;gap:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border:1px solid var(--line);border-radius:999px;background:var(--surface);text-decoration:none;font-weight:500;font-size:18px}
.pill:hover{border-color:var(--fg)}
.pill svg{width:24px;height:24px;flex:none}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.tag{padding:6px 18px;border-radius:999px;font-size:16px}
.tag[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.work{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.work .wide{grid-column:1/-1}
.work input[type=text],.work input[type=date]{width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.work small{color:var(--muted)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:12px 24px;margin:0}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
dialog{border:1px solid var(--fg);border-radius:12px;background:var(--bg);color:var(--fg);padding:20px;width:min(560px,calc(100% - 24px));max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 8px;font-size:18px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sw button{width:34px;height:34px;padding:0;border-radius:50%}
input[type=color]{width:100%;height:44px;border:1px solid var(--line);background:var(--surface);padding:2px;border-radius:8px}
input[type=text],textarea{width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
label{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
.msg{font-size:14px;color:var(--muted);margin-top:10px;min-height:1.5em}
@media (prefers-reduced-motion:no-preference){
.card,button,.btn,nav a,.brand,.stats>div,dd a,.pill{transition:transform .4s cubic-bezier(.34,1.8,.5,1),border-color .2s,background-color .2s,color .2s}
dd a{display:inline-block}
.card:hover{transform:scale(1.03)}
button:hover,.btn:hover,nav a:hover,.brand:hover,.stats>div:hover,dd a:hover,.pill:hover{transform:scale(1.1)}
.card:active,button:active,.btn:active,.pill:active{transform:scale(.94)}
dialog[open]{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
}
footer{max-width:1120px;margin:0 auto;padding:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px}
@media (max-width:640px){.bar{grid-template-columns:1fr auto}nav{grid-column:1/-1;order:3;justify-content:center}.hero{grid-template-columns:1fr}.hero canvas{justify-self:start;width:220px;height:300px;order:-1}.stats{gap:24px}}
.card[role="button"]{cursor:pointer}
dialog.detail{padding:0;width:min(980px,calc(100% - 32px));max-height:86vh;border-radius:16px;overflow:hidden}
dialog.detail::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.dGrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);min-height:340px}
.dImg{background:#000;display:flex;align-items:center;justify-content:center;padding:18px}
.dImg img{max-width:100%;max-height:72vh;border-radius:8px}
.dInfo{padding:30px 26px;position:relative;overflow-y:auto}
.dInfo h3{font-size:24px;margin:0 36px 12px 0;line-height:1.45}
.dAuthor{color:#ff3b3b;font-weight:500;margin-bottom:12px}
.dDate,.dTag{color:var(--muted);font-size:15px;margin-bottom:6px}
.dTag:empty,.dDate:empty,.dAuthor:empty{display:none}
.dDesc{margin:16px 0 0;white-space:pre-wrap;color:var(--muted);font-size:16px;line-height:1.7}
.dDesc:empty::before{content:"暫無描述";}
.dGo{margin-top:20px}
.dGo[hidden]{display:none}
.xbtn{position:absolute;z-index:2;top:10px;right:12px;cursor:pointer;border:none;background:none;font-size:22px;padding:4px 10px;color:var(--muted)}
@media (max-width:640px){.dGrid{grid-template-columns:1fr}.dImg img{max-height:40vh}}
#bgImg{position:fixed;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:none;background-size:cover;background-position:center top;background-repeat:no-repeat;-webkit-mask-image:linear-gradient(to bottom,#000 var(--fadeStart,45%),transparent 100%);mask-image:linear-gradient(to bottom,#000 var(--fadeStart,45%),transparent 100%)}
.has-img header{background:transparent}
#adminDlg{overflow-y:auto;z-index:50;position:fixed;top:24px;left:50%;transform:translateX(-50%);margin:0;max-height:calc(100vh - 48px);width:min(560px,calc(100% - 32px))}
.admHead{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-20px -20px 8px;padding:16px 20px 10px;border-bottom:1px solid var(--line)}
.admHead h3{margin:0}
.admBtns{display:flex;gap:10px;align-items:center}
#aSave{padding:8px 14px;font-size:15px}
#adminDlg .xbtn{position:static;margin:0;flex:none}
html.adminOpen main,html.adminOpen footer,html.adminOpen #bgImg,html.adminOpen .brand,html.adminOpen nav{filter:blur(6px);transition:filter .3s}
#adminDlg[open]{animation:popC .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes popC{from{opacity:0;transform:translateX(-50%) scale(.8)}to{opacity:1;transform:translateX(-50%) scale(1)}}
html.adminOpen main,html.adminOpen footer,html.adminOpen #bgImg{pointer-events:none}
#dial{touch-action:none;cursor:grab;display:block;flex:none;outline-offset:4px}
#dial:active{cursor:grabbing}
.dialRow{display:flex;gap:16px;align-items:center;margin-top:6px}
.carousel{position:relative;width:100%;max-width:680px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;user-select:none;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.cSlide{position:absolute;inset:0;transition:transform .6s cubic-bezier(.22,.7,.25,1);cursor:pointer}
.cSlide img{width:100%;height:100%;object-fit:cover;display:block}
.cNav{position:absolute;top:50%;margin-top:-20px;z-index:2;width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:26px;line-height:40px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cNav:hover{background:rgba(0,0,0,.7)}
.cPrev{left:12px}.cNext{right:12px}
.cLabel{position:absolute;left:18px;bottom:14px;z-index:2;color:#fff;font-weight:700;font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.8);max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.cDots{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.cDot{width:8px;height:8px;border-radius:99px;border:none;padding:0;background:rgba(255,255,255,.45);cursor:pointer}
.cDot.on{width:22px;background:#fff}
.cDot:hover{transform:none}
.cNav:hover{transform:none}
#adminDlg{padding:0;overflow:hidden}
#adminDlg[open]{display:flex;flex-direction:column;height:calc(100vh - 48px)}
#adminDlg .admHead{position:static;flex:none;margin:0;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--bg);border-radius:12px 12px 0 0}
#adminDlg #admBody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 20px 20px}
#aWorks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#adminDlg.wideWork{width:min(900px,calc(100% - 32px))}
.wCard{display:flex;flex-direction:column;gap:6px;padding:10px;margin:0}
.wCard input,.wCard textarea{width:100%;margin:0;min-width:0}
.wCard textarea{resize:vertical}
.wPrev{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--line);display:flex;align-items:center;justify-content:center}
.wPrev img{width:100%;height:100%;object-fit:cover;display:block}
.wPrev img[hidden]{display:none}
.wPrev .wNone{font-size:13px;color:var(--muted)}
.wPrev.has .wNone{display:none}
.wFile{font-size:12px;padding:4px}
.wDel{padding:6px 12px;font-size:14px;align-self:flex-start}
@media (max-width:640px){#aWorks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.wHead label{margin:12px 0 4px;flex:1;min-width:0}
.wHead button{flex:none;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="bgImg" aria-hidden="true"></div>
<header><div class="bar">
  <a class="brand" href="#home">YujianzZ</a>
  <nav aria-label="主選單"><a href="#home">首頁</a><a href="#videos">作品</a><a href="#contact">頻道</a></nav>
  <div class="hAct"><button id="openBg" type="button">背景顏色</button><button id="openAdmin" type="button" hidden>管理後台</button></div>
</div></header>

<main>
  <section id="home" data-title="首頁">
    <div class="hero">
      <div>
        <h1>你好！</h1>
        <p style="font-size:26px">我是遇見，一名 Minecraft 內容創作者</p>
        <div class="stats">
          <div><b id="stLong">—</b><span>長影片數</span></div>
          <div><b id="stSubs">—</b><span>訂閱數</span></div>
          <div><b id="stLast">—</b><span>距上次更新</span></div>
        </div>
        <div class="row">
          <a class="btn primary" href="https://www.youtube.com/@%E9%81%87%E8%A6%8BYujian?sub_confirmation=1" target="_blank" rel="noopener">訂閱頻道</a>
          <a class="btn" href="#videos">看作品</a>
        </div>
      </div>
      <canvas id="skin" width="440" height="600" aria-label="遇見的 Minecraft 皮膚，可點擊互動"></canvas>
    </div>
    <h2>最新影片</h2><div id="latest"></div>
    <h2>代表作</h2><div id="featured"></div>
    <h2>頻道會員感謝</h2>
    <p class="muted">感謝每一位加入頻道會員的朋友，你們是我繼續創作的動力！</p>
    <div class="list" id="members"></div>
  </section>

  <section id="videos" data-title="作品" hidden>
    <h2 style="margin-top:0">作品</h2>
    <div class="tags" id="tags"></div>
    <p class="muted" id="worksDesc"></p>
    <div class="list" id="videoList"></div>
  </section>

  <section id="contact" data-title="頻道" hidden>
    <h2 style="margin-top:0">頻道</h2>
    <div class="pills" id="links"></div>
  </section>
</main>
<footer><span>© 2026 YujianzZ</span></footer>


<dialog id="bgDlg" aria-label="背景顏色">
  <h3>背景顏色</h3>
  <div class="sw" id="swatches"></div>
  <input type="color" id="picker" aria-label="自訂背景顏色">
  <div class="row"><button type="button" id="reset">還原預設</button><button type="button" class="btn primary" id="bgClose">完成</button></div>
</dialog>

<dialog id="adminDlg" aria-label="管理後台">
  <div class="admHead" id="adminHead" title="按住拖動可移動視窗"><h3>管理後台（只有你看得到）</h3><div class="admBtns"><button type="button" class="btn primary" id="aSave">儲存並下載</button><button type="button" class="xbtn" id="aClose" aria-label="關閉後台">✕</button></div></div>
<div id="admBody">
  <div class="row" style="margin-top:0">
    <button type="button" class="btn primary" id="tabHome">首頁設定</button>
    <button type="button" class="btn" id="tabWorks">作品管理</button>
    <button type="button" class="btn" id="tabBg">背景外觀</button>
  </div>

  <div id="pHome">
    <label>首頁數字：長影片數、訂閱數（長影片數留空則使用作品數量）</label>
    <div style="display:flex;gap:8px"><input type="text" id="aLong" placeholder="長影片數"><input type="text" id="aSubs" placeholder="訂閱數，例如 1.2萬"></div>
    <label>首頁「最新影片」輪播（每 3 秒自動切換，按發佈日期由新到舊排列）</label>
    <div id="hLatest"></div>
    <button type="button" id="hLatestAdd">＋ 新增最新影片</button>
    <label>首頁「代表作」（會顯示在首頁，可點擊）</label>
    <div id="hFeat"></div>
    <label>頻道會員（每行：名稱 | 階級 | 月數）</label>
    <textarea id="aMembers" rows="4"></textarea>
    <label>頻道連結（每行：名稱 | 網址）</label>
    <textarea id="aLinks" rows="5"></textarea>
    <label>Minecraft 皮膚（64×64 PNG，小於 60 KB）</label>
    <input type="file" id="aSkin" accept="image/png">
    <label>手臂款式</label>
    <select id="aSlim" style="width:100%;font:inherit;font-size:14px;padding:8px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px"><option value="0">標準手臂（4 像素）</option><option value="1">纖細手臂（3 像素）</option></select>
  </div>

  <div id="pWorks" hidden>
    <div class="wHead">
      <label>作品列表（只在「作品」頁面顯示；縮圖請上傳；連結可留空，留空則點擊縮圖放大查看）</label>
      <button type="button" id="aAdd">＋ 新增作品</button>
    </div>
    <div id="aWorks"></div>
  </div>

  <div id="pBg" hidden>
    <label>背景顏色</label>
    <input type="color" id="bgC1" aria-label="背景顏色">
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="bgUseG" style="width:auto"> 使用漸層背景</label>
    <div id="bgGrow">
      <label>漸層結束顏色</label>
      <input type="color" id="bgC2" aria-label="漸層結束顏色">
      <label>漸層角度（拖動圓盤調整，或直接輸入 0 至 360）</label>
      <div class="dialRow">
        <svg id="dial" viewBox="0 0 120 120" width="120" height="120" role="slider" aria-label="漸層角度" tabindex="0">
          <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="8"/>
          <line id="dialNeedle" x1="60" y1="60" x2="60" y2="14" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
          <circle cx="60" cy="60" r="6" fill="currentColor"/>
        </svg>
        <input type="text" id="bgAngle" placeholder="135" style="width:100px">
      </div>
    </div>
    <label>背景圖片（大圖會自動縮小到 1920 像素寬）</label>
    <input type="file" id="bgFile" accept="image/*">
    <small id="bgSt" class="muted" style="display:block;margin-top:6px"></small>
    <button type="button" id="bgClear" style="margin-top:8px">移除背景圖片</button>
    <label>圖片淡出位置（0 至 100，數字越小，圖片越早淡出到背景色）</label>
    <input type="text" id="bgFade" placeholder="45">
    <label>圖片不透明度（0 至 100，越低越能看到背景顏色和漸層）</label>
    <input type="text" id="bgOp" placeholder="100">
    <label>圖片上下位置（0 為靠上，100 為靠下；圖片比視窗高時才看得出效果）</label>
    <input type="text" id="bgPos" placeholder="0">
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="bgFollow" style="width:auto"> 背景圖片跟隨頁面上下捲動</label>
  </div>

  
  <div class="msg" id="aMsg" role="status"></div>
  <textarea id="aExport" rows="4" hidden readonly></textarea>
</div>
</dialog>

<dialog id="imgDlg" class="detail" aria-label="作品詳情">
  <button type="button" class="xbtn" id="imgClose" aria-label="關閉">✕</button>
  <div class="dGrid">
    <div class="dImg"><img id="dImg" alt=""></div>
    <div class="dInfo">
      <h3 id="dTitle"></h3>
      <div class="dAuthor" id="dAuthor"></div>
      <div class="dDate" id="dDate"></div>
      <div class="dTag" id="dTag"></div>
      <p class="dDesc" id="dDesc"></p>
      <a class="btn primary dGo" id="dGo" target="_blank" rel="noopener" hidden>前往觀看</a>
    </div>
  </div>
</dialog>

// latest-video carousel

}
// dir: 1 = slide left (next), -1 = slide right (previous)
function carGo(i, dir){
  var n = carItems.length; if (!n) return;
  var old = carIdx; carIdx = ((i % n) + n) % n;

function render(){

  var scene = new T.Scene(), cam = new T.PerspectiveCamera(30, 440 / 600, 1, 300); cam.position.set(0, 0, 100);
  var tex = D.skin ? new T.TextureLoader().load(D.skin) : new T.CanvasTexture(placeholderSkin());
  tex.magFilter = T.NearestFilter; tex.minFilter = T.NearestFilter;
  var mat = new T.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.5 });
  function mesh(w, h, d, ux, uy, grow){
    var geo = new T.BoxGeometry(w + grow, h + grow, d + grow), uv = geo.attributes.uv;
    var f = [[ux + d + w, uy + d, d, h], [ux, uy + d, d, h], [ux + d, uy, w, d], [ux + d + w, uy, w, d], [ux + d, uy + d, w, h], [ux + 2 * d + w, uy + d, w, h]];
    f.forEach(function(q, i){
      var u0 = q[0] / 64, u1 = (q[0] + q[2]) / 64, v0 = 1 - q[1] / 64, v1 = 1 - (q[1] + q[3]) / 64;
      var ta = i === 3 ? v1 : v0, tb = i === 3 ? v0 : v1; uv.setXY(i * 4, u0, ta); uv.setXY(i * 4 + 1, u1, ta); uv.setXY(i * 4 + 2, u0, tb); uv.setXY(i * 4 + 3, u1, tb);
    });
    return new T.Mesh(geo, mat);
  }
  var model = new T.Group(); scene.add(model); model.position.y = -16;
  function limb(w, h, d, a, b, x, y, off){
    var g = new T.Group(); g.position.set(x, y, 0);
    var m1 = mesh(w, h, d, a[0], a[1], 0), m2 = mesh(w, h, d, b[0], b[1], 0.5); m1.position.y = m2.position.y = off; g.add(m1, m2); model.add(g); return g;
  }
  var head = limb(8, 8, 8, [0, 0], [32, 0], 0, 24, 4), body = limb(8, 12, 4, [16, 16], [16, 32], 0, 24, -6);
  var aw = D.slim ? 3 : 4, ax = 4 + aw / 2;
  var armR = limb(aw, 12, 4, [40, 16], [40, 32], -ax, 24, -6), armL = limb(aw, 12, 4, [32, 48], [48, 48], ax, 24, -6);
  var legR = limb(4, 12, 4, [0, 16], [0, 32], -2, 12, -6), legL = limb(4, 12, 4, [16, 48], [0, 48], 2, 12, -6);
  var dragYaw = 0, still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var t0 = performance.now();
  (function loop(now){
    requestAnimationFrame(loop); if ($("home").hidden) return;
    var t = (now - t0) / 1000, k = still ? 0 : 1, s = Math.sin(t * 2), dt = Math.min(0.05, (now - (loop.p || now)) / 1000);
    loop.p = now; if (!still) dragYaw += dt * 0.9;
    model.rotation.y = 0.2 + dragYaw;
    armR.rotation.x = s * 0.18 * k; armL.rotation.x = -s * 0.18 * k; legR.rotation.x = -s * 0.12 * k; legL.rotation.x = s * 0.12 * k;
    armR.rotation.z = 0.04 + Math.sin(t * 1.2) * 0.02 * k;
    body.position.y = 24 + Math.sin(t * 2) * 0.12 * k;
    renderer.render(scene, cam);
  })(t0);
}

// admin
function buildHtml(){
  var c = document.documentElement.cloneNode(true);
  ["latest","featured","members","videoList","tags","links","aWorks","hLatest","hFeat"].forEach(function(id){
    var e = c.querySelector("#" + id); if (e) e.innerHTML = "";
  });
  var bgi = c.querySelector("#bgImg"); if (bgi) bgi.removeAttribute("style");
  var di = c.querySelector("#dImg"); if (di) di.removeAttribute("src");
  c.removeAttribute("style"); c.className = "";
  c.querySelectorAll("dialog").forEach(function(d){ d.removeAttribute("open"); });
  var ad = c.querySelector("#adminDlg"); if (ad) { ad.removeAttribute("style"); ad.className = ""; }
  var oa = c.querySelector("#openAdmin"); if (oa) oa.setAttribute("hidden", "");
  var t = c.querySelector("title"); if (t) t.textContent = "YujianzZ";
  c.querySelectorAll("main section").forEach(function(sec){ sec.hidden = sec.id !== "home"; });
  c.querySelector("#site-data").textContent = JSON.stringify(D).replace(/</g, "\\u003c");
  return "<!DOCTYPE html>\n" + c.outerHTML;
}
function downloadHtml(html){
  var blob = new Blob([html], { type: "text/html;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "index.html";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function fillBg(){
  $("bgC1").value = D.bg || "#0c0c0c";
  $("bgUseG").checked = !!(D.bgG && D.bgG.on);
  $("bgC2").value = (D.bgG && D.bgG.to) || "#1d1428";
  $("bgAngle").value = (D.bgG && D.bgG.angle) || 135;
  $("bgFade").value = (D.bgFade == null ? 45 : D.bgFade);
  $("bgPos").value = (D.bgPos || 0);
  $("bgOp").value = (D.bgOp == null ? 100 : D.bgOp);
  $("bgFollow").checked = !!D.bgFollow;
  setDial((D.bgG && D.bgG.angle) || 135);
  $("bgGrow").hidden = !$("bgUseG").checked;
  $("bgSt").textContent = D.bgImg ? "已設定背景圖片" : "尚未設定背景圖片";
}
function liveBg(){
  localOverride = false; drop("yj-bg");
  D.bg = $("bgC1").value;
  var ang = parseFloat($("bgAngle").value); if (isNaN(ang)) ang = 135;
  ang = ((ang % 360) + 360) % 360;
  D.bgG = { on: $("bgUseG").checked, to: $("bgC2").value, angle: Math.round(ang) };
  var fd = parseInt($("bgFade").value, 10); if (isNaN(fd)) fd = 45;
  D.bgFade = Math.max(0, Math.min(100, fd));
  var ps = parseInt($("bgPos").value, 10); if (isNaN(ps)) ps = 0;
  D.bgPos = Math.max(0, Math.min(100, ps));
  var op = parseInt($("bgOp").value, 10); if (isNaN(op)) op = 100;
  D.bgOp = Math.max(0, Math.min(100, op));
  D.bgFollow = $("bgFollow").checked;
  $("bgGrow").hidden = !D.bgG.on;
  refreshBg();
}
["bgC1", "bgUseG", "bgC2", "bgAngle", "bgFade", "bgOp", "bgPos", "bgFollow"].forEach(function(id){ $(id).oninput = liveBg; $(id).onchange = liveBg; });
$("bgFile").onchange = function(){
  var f = $("bgFile").files[0]; if (!f) return; $("bgSt").textContent = "處理中…";
  shrink(f, 1920, function(url){
    if (!url) { $("bgSt").textContent = "圖片讀取失敗"; return; }
    D.bgImg = url; refreshBg(); $("bgSt").textContent = "背景圖片已更新（按「儲存並發佈」後生效）";
  });
};
// angle dial
function setDial(a){
  a = ((a % 360) + 360) % 360;
  var rad = a * Math.PI / 180, n = $("dialNeedle");
  n.setAttribute("x2", (60 + 46 * Math.sin(rad)).toFixed(2));
  n.setAttribute("y2", (60 - 46 * Math.cos(rad)).toFixed(2));
  $("dial").setAttribute("aria-valuenow", Math.round(a));
  $("bgAngle").value = Math.round(a);
}
(function(){
  var dial = $("dial"), dragging = false;
  function at(e){
    var r = dial.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width * 120 - 60, y = (e.clientY - r.top) / r.height * 120 - 60;
    setDial(Math.atan2(x, -y) * 180 / Math.PI); liveBg();
  }
  dial.addEventListener("pointerdown", function(e){ dragging = true; dial.setPointerCapture(e.pointerId); at(e); });
  dial.addEventListener("pointermove", function(e){ if (dragging) at(e); });
  dial.addEventListener("pointerup", function(){ dragging = false; });
  dial.addEventListener("keydown", function(e){
    var a = parseFloat($("bgAngle").value) || 0;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { setDial(a + 5); liveBg(); e.preventDefault(); }
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { setDial(a - 5); liveBg(); e.preventDefault(); }
  });
  $("bgAngle").addEventListener("change", function(){ setDial(parseFloat($("bgAngle").value) || 0); liveBg(); });
})();

// draggable, non-modal admin window
(function(){
  var dlg = $("adminDlg"), h = $("adminHead"), sx, sy, ox, oy, dragging = false;
  h.style.cursor = "move"; h.style.userSelect = "none"; h.style.touchAction = "none";
  h.addEventListener("pointerdown", function(e){
    if (e.target.closest("button")) return;
    var r = dlg.getBoundingClientRect();
    dlg.style.position = "fixed"; dlg.style.margin = "0"; dlg.style.transform = "none";
    dlg.style.left = r.left + "px"; dlg.style.top = r.top + "px";
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; dragging = true;
    h.setPointerCapture(e.pointerId);
  });
  h.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var nx = Math.min(Math.max(0, ox + e.clientX - sx), innerWidth - 80);
    var ny = Math.min(Math.max(0, oy + e.clientY - sy), innerHeight - 40);
    dlg.style.left = nx + "px"; dlg.style.top = ny + "px";
  });
  h.addEventListener("pointerup", function(){ dragging = false; });
})();

$("bgClear").onclick = function(){ D.bgImg = ""; $("bgFile").value = ""; refreshBg(); $("bgSt").textContent = "已移除背景圖片"; };
function parseLines(txt){ return txt.split("\n").map(function(l){ return l.split("|").map(function(x){ return x.trim(); }); }).filter(function(p){ return p[0]; }); }
function shrink(file, max, cb){
  var fr = new FileReader();
  fr.onerror = function(){ cb(""); };
  fr.onload = function(){
    // small files are kept exactly as uploaded, so they stay sharp
    if (file.size <= 600000) { cb(fr.result); return; }
    var im = new Image();
    im.onerror = function(){ cb(""); };
    im.onload = function(){
      var k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.92));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function readDataURL(file){ return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(file); }); }
// kind: "latest" | "featured" | "work"; each kind only has the fields it uses
function itemRow(it, kind){
  it = it || {};
  var r = el("div", "work"); r.dataset.cover = it.cover || "";
  function inp(k, ph, val, type, wide){ var i = el("input"); i.type = type || "text"; i.placeholder = ph; i.value = val || ""; i.dataset.k = k; i.setAttribute("aria-label", ph); if (wide) i.className = "wide"; r.appendChild(i); return i; }
  inp("title", kind === "work" ? "作品標題" : (kind === "latest" ? "最新影片標題" : "代表作標題"), it.title, "text", true);
  inp("link", "點擊後前往的連結（YouTube、抖音、B站等，可留空）", it.link, "text", true);
  inp("author", "上傳人名字", it.author, "text", false);
  if (kind !== "featured") inp("date", "發佈日期", it.date, "date", false);
  if (kind === "work") inp("tag", "分類（留空為「" + DEFTAG + "」）", it.tag, "text", false);
  var ta = el("textarea"); ta.rows = 3; ta.placeholder = "描述（可留空）"; ta.value = it.desc || ""; ta.dataset.k = "desc"; ta.className = "wide";
  ta.style.cssText = "width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px";
  ta.setAttribute("aria-label", "描述"); r.appendChild(ta);
  var cw = el("div", "wide"), st = el("small", "", it.cover ? "已有縮圖（選擇新圖片可替換）" : "請上傳縮圖"), f = el("input");
  f.type = "file"; f.accept = "image/*"; f.setAttribute("aria-label", "上傳縮圖");
  f.onchange = function(){
    var file = f.files[0]; if (!file) return; st.textContent = "處理中…";
    shrink(file, 1400, function(url){
      if (!url) { st.textContent = "圖片讀取失敗"; return; }
      r.dataset.cover = url; st.textContent = "縮圖已更新（按「儲存並發佈」後生效）";
    });
  };
  cw.appendChild(f); cw.appendChild(document.createElement("br")); cw.appendChild(st); r.appendChild(cw);
  if (kind === "work" || kind === "latest") { var ct = el("div", "wide"), del = el("button", "", "刪除作品"); del.type = "button"; del.onclick = function(){ r.remove(); }; ct.appendChild(del); r.appendChild(ct); }
  return r;
}
function workCard(it){
  it = it || {};
  var r = el("div", "work wCard"); r.dataset.cover = it.cover || "";
  var pv = el("div", "wPrev"), img = el("img"); img.alt = "";
  pv.appendChild(img); pv.appendChild(el("span", "wNone", "未設定縮圖")); r.appendChild(pv);
  function setPv(u){
    if (u) { img.src = u; img.hidden = false; pv.classList.add("has"); }
    else { img.removeAttribute("src"); img.hidden = true; pv.classList.remove("has"); }
  }
  setPv(it.cover);
  var f = el("input"); f.type = "file"; f.accept = "image/*"; f.className = "wFile"; f.setAttribute("aria-label", "上傳縮圖");
  f.onchange = function(){
    var file = f.files[0]; if (!file) return;
    shrink(file, 1400, function(url){ if (!url) return; r.dataset.cover = url; setPv(url); });
  };
  r.appendChild(f);
  function inp(k, ph, val, type){
    var i = el("input"); i.type = type || "text"; i.placeholder = ph; i.value = val || "";
    i.dataset.k = k; i.setAttribute("aria-label", ph); r.appendChild(i); return i;
  }
  inp("title", "作品標題", it.title);
  inp("link", "連結（可留空）", it.link);
  inp("author", "上傳人名字", it.author);
  inp("date", "日期", it.date, "date");
  inp("tag", "分類（留空為「" + DEFTAG + "」）", it.tag);
  var ta = el("textarea"); ta.rows = 2; ta.placeholder = "描述（可留空）"; ta.value = it.desc || ""; ta.dataset.k = "desc";
  ta.setAttribute("aria-label", "描述"); r.appendChild(ta);
  var del = el("button", "wDel", "刪除作品"); del.type = "button"; del.onclick = function(){ r.remove(); };
  r.appendChild(del);
  return r;
}
function readRow(r){
  var q = function(k){ var e = r.querySelector('[data-k="' + k + '"]'); return e ? e.value.trim() : ""; };
  var link = q("link"), warn = "";
  if (link && !/^https?:\/\//.test(link)) { warn = "連結需以 https:// 開頭，已忽略連結。"; link = ""; }
  if (/youtube\.com\/shorts\//.test(link)) { warn = "不接受 YouTube Shorts，已忽略連結。"; link = ""; }
  return { title: q("title"), author: q("author"), link: link, date: q("date"), tag: q("tag"), desc: q("desc"), cover: r.dataset.cover || "", warn: warn };
}
function fillAdmin(){
  fillBg();

  (D.videos || []).forEach(function(v){ box.appendChild(workCard(v)); });
  $("aLong").value = D.longCount || ""; $("aSubs").value = D.subs || ""; $("aSlim").value = D.slim ? "1" : "0";
  $("aMembers").value = (D.members || []).map(function(m){ return m.name + " | " + m.tier + " | " + m.months; }).join("\n");
  $("aLinks").value = (D.links || []).map(function(l){ return l.label + " | " + l.url; }).join("\n");
}
function tab(w){
  $("pHome").hidden = w !== "home"; $("pWorks").hidden = w !== "works"; $("pBg").hidden = w !== "bg";
  $("adminDlg").classList.toggle("wideWork", w === "works");

$("aSave").onclick = async function(){
  var file = $("aSkin").files[0];
  if (file && file.size > 60000) { msg("皮膚檔太大，請使用小於 60 KB 的 PNG。"); return; }
  var warns = [];
  function take(r){ var x = readRow(r); if (x.warn) warns.push(x.warn); delete x.warn; return x; }
  var LL = [];
  document.querySelectorAll("#hLatest .work").forEach(function(r){ var x = take(r); if (hasItem(x)) LL.push(x); });
  D.latestList = LL;
  var F = take($("hFeat").querySelector(".work"));
  D.featured = hasItem(F) ? F : { title: "", link: "", cover: "" };
  var vids = [];
  document.querySelectorAll("#aWorks .work").forEach(function(r){ var x = take(r); if (hasItem(x)) vids.push(x); });
  D.videos = vids;
  D.longCount = $("aLong").value.trim(); D.subs = $("aSubs").value.trim(); D.slim = $("aSlim").value === "1";
  D.members = parseLines($("aMembers").value).map(function(p){ return { name: p[0], tier: p[1] || "", months: p[2] || "0" }; });
  D.links = parseLines($("aLinks").value).map(function(p){ return { label: p[0], url: p[1] || "" }; });
  try { if (file) D.skin = await readDataURL(file); } catch(e){}
  liveBg();
  render();
  var bad = warns.join(" ");
  var html = buildHtml();
  downloadHtml(html);
  if (window.claude && claude.use) {
    try { var art = await claude.use("artifact"); if (art) { await art.publish(html); } } catch(e){}
  }
  msg(bad + " 已下載 index.html。請把它上傳到 GitHub 取代舊文件（步驟見說明文件）。");
};

D.latestList = D.latestList || (hasItem(D.latest) ? [D.latest] : []);
D.bgG = D.bgG || { on: false, to: "#1d1428", angle: 135 };

if (D.bgFade == null) D.bgFade = 45;
D.bgPos = D.bgPos || 0; D.bgFollow = !!D.bgFollow;

setBg(localOverride ? sb : (D.bg || "#0c0c0c")); paintImg();

if (location.protocol === "file:") $("openAdmin").hidden = false;
if (window.claude && claude.use) claude.use("user").then(function(u){ if (u && u.isOwner()) $("openAdmin").hidden = false; }).catch(function(){});
